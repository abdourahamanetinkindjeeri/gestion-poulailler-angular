<aside class="sidebar" [class.collapsed]="collapsed">
  <!-- HEADER -->
  <div class="sidebar-header">
    <div class="logo-container d-flex align-items-center">
      <div class="logo d-flex align-items-center justify-content-center">
        <i class="fas fa-box"></i>
      </div>
      <div class="logo-text" *ngIf="!collapsed">
        <h2>Gestion de stock</h2>
        <p>By Jeeri</p>
      </div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav class="sidebar-nav">
    <ng-container *ngFor="let menu of menuList">
      <!-- Menu principal -->
      <div class="nav-item d-flex align-items-center justify-content-between"
           [ngClass]="{'active': menu.active}"
           (click)="menu.sousMenu ? toggleMenu(menu) : navigate(menu)"
           [attr.title]="collapsed ? menu.titre : null">
        <div class="d-flex align-items-center">
          <i [class]="menu.icon"></i>
          <span class="ms-2" *ngIf="!collapsed">{{ menu.titre }}</span>
        </div>
        <i class="fas fa-chevron-down" *ngIf="menu.sousMenu && !collapsed"
           [ngClass]="{'rotate-180': menu.open}"></i>
      </div>

      <!-- Sous-menu récursif -->
      @if(menu.sousMenu && menu.open){
      <div class="sub-menu">
        <ng-container *ngFor="let sub of menu.sousMenu">
          <div class="nav-item d-flex align-items-center ms-3"
               [ngClass]="{'active': sub.active}"
               (click)="navigate(sub)"
               [attr.title]="collapsed ? sub.titre : null">
            <i [class]="sub.icon"></i>
            <span class="ms-2" *ngIf="!collapsed">{{ sub.titre }}</span>
          </div>

          <!-- Sous-sous-menu (récursif si nécessaire) -->
          <ng-container *ngIf="sub.sousMenu && sub.open">
            <div *ngFor="let sub2 of sub.sousMenu" class="nav-item d-flex align-items-center ms-4"
                 [ngClass]="{'active': sub2.active}"
                 (click)="navigate(sub2)"
                 [attr.title]="collapsed ? sub2.titre : null">
              <i [class]="sub2.icon"></i>
              <span class="ms-2" *ngIf="!collapsed">{{ sub2.titre }}</span>
            </div>
          </ng-container>

        </ng-container>
      </div>
      }
    </ng-container>
  </nav>

  <!-- FOOTER -->
  <div class="sidebar-footer mt-auto" *ngIf="!collapsed">
    <div class="user-profile d-flex align-items-center gap-2 p-2">
      <div class="user-avatar d-flex align-items-center justify-content-center">AB</div>
      <div class="user-info">
        <div class="user-name">Ali Bouali</div>
        <div class="user-role">Administrateur</div>
      </div>
      <i class="fas fa-ellipsis-v text-muted"></i>
    </div>
  </div>
</aside>
